name: Run DBT Runner with parameters
run-name: Run DBT Runner with parameters '${{ inputs.parameters }}' in environment ${{ inputs.environment }}

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
        description: 'Environment (testi/tuotanto)'
      parameters:
        description: 'Additional parameters for dbt build, e.g. --select tag:my_tag --exclude my_model'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: 'Environment (testi/tuotanto)'
        options:
          - testi
          - tuotanto
      parameters:
        description: 'Additional parameters for dbt build, e.g. --select tag:my_tag --exclude my_model'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Run DBT Runner
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials (TESTI)
        if: ${{ inputs.environment == 'testi' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OVARA_TESTI_ROLE_ARN }}
          role-session-name: testi-dbt-runner-deploy
          aws-region: eu-west-1

      - name: Configure AWS credentials (TUOTANTO)
        if: ${{ inputs.environment == 'tuotanto' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OVARA_TUOTANTO_ROLE_ARN }}
          role-session-name: tuotanto-dbt-runner-deploy
          aws-region: eu-west-1

      - name: Run scheduled task (TESTI)
        if: ${{ inputs.environment == 'testi' }}
        env:
          PARAMETERS: ${{ inputs.parameters }}
        run: |
          # Parametrit pilkotaan välilyönneistä erillisiksi argumenteiksi.
          # set -f estää tiedostonimien laajennuksen esim. --select model*
          set -f
          # shellcheck disable=SC2086
          ci-tools/run-testi-dbt-runner.sh $PARAMETERS

      - name: Run scheduled task (TUOTANTO)
        if: ${{ inputs.environment == 'tuotanto' }}
        env:
          PARAMETERS: ${{ inputs.parameters }}
        run: |
          # Parametrit pilkotaan välilyönneistä erillisiksi argumenteiksi.
          # set -f estää tiedostonimien laajennuksen esim. --select model*
          set -f
          # shellcheck disable=SC2086
          ci-tools/run-tuotanto-dbt-runner.sh $PARAMETERS

